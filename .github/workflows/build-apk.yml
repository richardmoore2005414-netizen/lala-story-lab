# Build Android APK — download from Actions → Artifacts
# Newbie steps:
# 1. Actions → Build APK → Run workflow
# 2. Wait for green check (5–15 min)
# 3. Open the run → Artifacts → download lala-story-lab-apk
# 4. Install LalaStoryLab.apk on your phone

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app (Vite → dist/)
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (use runner preinstall + needed packages)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # GitHub-hosted runners already ship Android SDK
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # Accept licenses non-interactively
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true

          # Install only packages Capacitor/Gradle need (no obsolete "tools")
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          sdkmanager --list_installed | head -40

      - name: Install Capacitor and create Android project
        run: |
          npm install -D @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          cat > capacitor.config.json << 'CAP'
          {
            "appId": "com.lalastorylab.app",
            "appName": "Lala Story Lab",
            "webDir": "dist",
            "server": { "androidScheme": "https" }
          }
          CAP
          npx cap add android
          npx cap sync android

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          CI: true

      - name: Locate and rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/LalaStoryLab.apk
          ls -lh artifacts/LalaStoryLab.apk

      - name: Upload APK (download from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: lala-story-lab-apk
          path: artifacts/LalaStoryLab.apk
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## APK ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Scroll to **Artifacts** on this page" >> $GITHUB_STEP_SUMMARY
          echo "2. Download **lala-story-lab-apk**" >> $GITHUB_STEP_SUMMARY
          echo "3. Install **LalaStoryLab.apk** on your Android phone" >> $GITHUB_STEP_SUMMARY
