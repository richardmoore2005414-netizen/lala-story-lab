# Build Android APK & upload to GitHub Releases, Artifacts & Google Drive
name: Build APK & Upload to Google Drive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
      - 'capacitor.config.json'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web app (Vite → dist/)
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment
        run: |
          echo "Setting up Android SDK environment..."
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # Add command line tools and platform-tools to PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # Accept all Android licenses non-interactively
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          # Ensure Android 34 platform & build-tools are installed
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android platform to Capacitor..."
            npx cap add android
          fi
          echo "Syncing web assets to Android project..."
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"
        env:
          CI: true

      - name: Locate and copy APK to artifacts
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in android/app/build/outputs/apk!"
            exit 1
          fi
          echo "Found generated APK: $APK_PATH"
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/LalaStoryLab.apk
          echo "APK file size:"
          ls -lh artifacts/LalaStoryLab.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lala-story-lab-apk
          path: artifacts/LalaStoryLab.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: apk-latest
          name: "Lala Story Lab APK (手機直接安裝包)"
          body: |
            ## 📱 Lala Story Lab Android APK 下載
            - **手機點擊直接下載**：[LalaStoryLab.apk](https://github.com/${{ github.repository }}/releases/download/apk-latest/LalaStoryLab.apk)
            - **Google Drive 儲存**：可將此 APK 直接拖曳至您的 Google 雲端硬碟存放與分享。
          files: artifacts/LalaStoryLab.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Google Drive (if secrets configured)
        if: ${{ env.GDRIVE_CREDENTIALS != '' && env.GDRIVE_FOLDER_ID != '' }}
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: "artifacts/LalaStoryLab.apk"
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: "true"
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      - name: Summary & Instructions
        run: |
          echo "## 📱 Android APK 建置完成！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 超簡單下載方式（手機點擊直接安裝）" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[直接下載 LalaStoryLab.apk](https://github.com/${{ github.repository }}/releases/download/apk-latest/LalaStoryLab.apk)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "下載後可以直接傳進你的 **Google Drive**，隨時在任何手機上安裝！" >> $GITHUB_STEP_SUMMARY
